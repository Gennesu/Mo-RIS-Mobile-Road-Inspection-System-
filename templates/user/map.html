{% extends "layout/base.html" %}

{% block title %} Map {% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/root.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/landing-navbar.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/maps/map.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/maps/popup.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/maps/floating-panel.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/maps/severity-color.css') }}" />

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/maps/routing-dark.css') }}" />
{% endblock %}

{% block header %}

<!-- Navbar -->

{% endblock %}

{% block main %}
<div class="map-container">
    <a class="floating-back" href="/" aria-label="Kembali ke halaman utama">
        <span aria-hidden="true">&lt;</span>
        Back
    </a>

    <div id="map"></div>

    <div class="floating-panel">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" placeholder="Search location...">
        </div>

        <div class="quick-actions">
            <button class="action-btn" id="btn-filter">
                🚧
                <span>Filter</span>
            </button>

            <button class="action-btn" id="btn-statistic">
                📊
                <span>Priority</span>
            </button>

        </div>

        <div class="panel-content" id="panel-content">
            <div class="welcome-panel">
                <h2>Mo-RIS</h2>

                <p>Mobile Road Inspection System</p>
                <hr>
                <p>Select a marker to see pothole details.</p>
            </div>
        </div>
    </div>

    <div class="map-actions">
        <button id="btn-location" class="map-btn" title="My Location">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 2v3"></path>
                <path d="M12 19v3"></path>
                <path d="M2 12h3"></path>
                <path d="M19 12h3"></path>
            </svg>
        </button>

        <button id="btn-hide-route" class="map-btn" title="Hide Route">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M6 12h12"></path>
                <path d="M9 18h6"></path>
            </svg>
        </button>
    </div>
</div>
{% endblock %}


{% block scripts %}
<script>
    const potholes = {{ potholes| tojson }};
    const priorityRoads = {{ priority_roads| tojson }};
</script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="{{ url_for('static', filename='js/maps/floating-panel/main-panel.js') }}"></script>
<script src="{{ url_for('static', filename='js/maps/floating-panel/filter-panel.js') }}"></script>
<script src="{{ url_for('static', filename='js/maps/floating-panel/priority-panel.js') }}"></script>
<script src="{{ url_for('static', filename='js/maps/popup.js') }}"></script>
<script src="{{ url_for('static', filename='js/maps/marker.js') }}"></script>
<script src="{{ url_for('static', filename='js/maps/map.js') }}"></script>

<script src="{{ url_for('static', filename='js/maps/services/location.js') }}"></script>
<script src="{{ url_for('static', filename='js/maps/services/find-route.js') }}"></script>

<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.min.js"></script>

{% endblock %}
