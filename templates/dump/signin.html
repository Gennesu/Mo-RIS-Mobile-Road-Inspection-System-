<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Login - SIKSa</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/root.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nav_btn.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sign.css') }}" />
</head>

<body>
    <div class="bg"></div>
    <header>
        <div class="navbar">
            <div class="logo"><a href="/">SIKS</a></div>

            <div class="menu-toggle" id="menu-toggle">
                ☰
            </div>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </header>
    <div class="cont">
        <section class="login-section">
            <div class="login-card">
                <h1>Masuk ke Akun Anda</h1>

                <form class="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="nama@email.com" required />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required />
                    </div>

                    <div class="form-forgot">
                        <a href="#" class="forgot-password">Lupa password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Masuk
                    </button>
                </form>

                <div class="login-footer">
                    <p>
                        Belum punya akun?
                        <a href="{{ url_for('signup') }}" class="signup-link">Daftar sekarang</a>
                    </p>
                </div>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
